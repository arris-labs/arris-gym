name: BenchCAD score calibration

on:
  push:
    branches: [plan/rescore-lobed-knob-scoring-timeout]
    paths:
      - .github/workflows/rescore-timing.yml
      - tools/rescore_timing_probe.py

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra corpus
      - name: Record runner details
        run: |
          mkdir rescore-timing
          {
            git rev-parse HEAD
            uname -m
            lscpu
          } | tee rescore-timing/machine.txt
      - name: Time scoring against the committed pair
        run: |
          set -o pipefail
          uv run --locked --extra corpus python tools/rescore_timing_probe.py \
            --workers 4 --deadline 60 | tee rescore-timing/probe.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: rescore-timing-${{ matrix.os }}
          path: rescore-timing/
          if-no-files-found: error
