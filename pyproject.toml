[project]
name = "arris-gym"
version = "0.1.0"
description = "Run, score and train CAD-code models on a kernel you can trust: exact, deterministic, every failure counted."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Sergei Sergienko" }]
keywords = ["CAD", "B-Rep", "CadQuery", "benchmark", "reinforcement learning"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
# arris and numpy are pinned exactly: both are recorded in every result row,
# and a bump is a deliberate change with a fidelity re-run (SEED.md §7).
dependencies = [
    "arris==0.10.0",
    "numpy==2.3.4",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
# Reading a corpus (arris-gym census): not needed to run or score a program.
corpus = [
    "huggingface-hub==2.4.0",
    "pyarrow==26.0.1",
]

[project.scripts]
arris-gym = "arris_gym._cli:main"

[project.urls]
Repository = "https://github.com/arris-labs/arris-gym"

[dependency-groups]
dev = [
    "huggingface-hub==2.4.0",
    "hypothesis>=6.140",
    "mypy>=1.18",
    "pyarrow==26.0.1",
    "pytest>=8.4",
    "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]
# Fixture programs are the inputs under test: some are broken on purpose.
extend-exclude = ["tests/fixtures"]
# Python files only: ruff would otherwise reformat code blocks in Markdown,
# SEED.md's among them, and SEED.md is frozen.
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PT", "T20", "BLE"]

[tool.ruff.lint.per-file-ignores]
# Command-line tools report by printing.
"tools/*" = ["T20"]
"src/arris_gym/_cli.py" = ["T20"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "tools"]
exclude = ["^tools/oracle/", "^tests/fixtures/"]

# pyarrow ships neither stubs nor py.typed; it is used in the corpus reader only.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# `oracle` tests need the oracle environment (`uv sync --project tools/oracle`),
# so the gate leaves them out; `uv run pytest -m oracle` runs them.
addopts = "-q --strict-markers --strict-config -m 'not oracle'"
markers = ["oracle: needs the synced oracle environment; not in the gate"]
pythonpath = ["tools"]
# A regression fixture is xfail with the desired assertion. Strict, so the
# commit that fixes it has to lift the mark (.agents/rules/gym.md).
xfail_strict = true
